<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Теннис — набор{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --court:#1f5d43; --court-dark:#16442f; --ball:#d7f23a; --chalk:#f7f8f2; --ink:#14231b; --muted:#5c6b62; --line:#dfe5da; --err:#b3261e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--chalk);color:var(--ink);line-height:1.55;font-size:17px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:var(--court);color:#fff;position:relative;overflow:hidden;padding:56px 0 64px}
.hero::before{content:"";position:absolute;inset:18px;border:2px solid rgba(255,255,255,.55);pointer-events:none}
.hero::after{content:"";position:absolute;left:50%;top:18px;bottom:18px;width:2px;background:rgba(255,255,255,.55);pointer-events:none}
.hero .wrap{position:relative;z-index:1;background:var(--court);padding:28px 24px;max-width:640px;text-align:left}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0 0 24px;color:#d6e6dc;max-width:46ch}
.btn{display:inline-block;min-height:50px;line-height:22px;text-align:center;background:var(--ball);color:var(--ink);font:inherit;font-weight:800;border:0;border-radius:999px;padding:14px 30px;text-decoration:none;cursor:pointer;font-size:1.05rem}
.btn:hover{filter:brightness(.95)}
.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ball);outline-offset:3px}
.btn.dark{background:var(--court);color:#fff}
section{padding:44px 0 0}
h2{font-size:1.7rem;margin:0 0 18px;font-weight:800;letter-spacing:-.01em}
.notice{border-left:6px solid var(--ball);background:#fff;padding:16px 20px;margin-bottom:14px;box-shadow:0 0 0 1px var(--line)}
.notice h3{margin:0 0 6px;font-size:1.15rem}
.notice p{margin:0;white-space:pre-line}
.notice small{color:var(--muted)}
.empty{color:var(--muted)}
.tablewrap{overflow-x:auto;background:#fff;box-shadow:0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
th{background:var(--court-dark);color:#fff;font-weight:600}
tr:last-child td{border-bottom:0}
td.n{color:var(--muted);width:48px}
.count{font-weight:400;color:var(--muted);font-size:1.1rem}
.msg{background:var(--ball);color:var(--ink);padding:14px 20px;font-weight:600}
form{background:#fff;box-shadow:0 0 0 1px var(--line);padding:28px;max-width:520px}
label{display:block;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;min-height:50px;padding:12px 14px;border:2px solid var(--line);background:var(--chalk);margin-bottom:6px;border-radius:0}
input:focus{border-color:var(--court);outline:none}
.field{margin-bottom:16px}
.errorlist{list-style:none;margin:0 0 6px;padding:0;color:var(--err);font-size:.95rem}
footer{padding:48px 0;color:var(--muted);font-size:.95rem}
body{-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.credit{margin:0;padding:8px 0 28px;color:var(--muted);font-size:.95rem}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(247,248,242,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.sticky .btn{display:block;width:100%}
.about-title{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:0 0 14px;font-weight:800}
.about-lead{max-width:46ch;color:var(--muted);margin:0 0 22px}
.about-actions{display:grid;gap:12px;max-width:420px}
.cta{display:block;text-align:center;background:var(--ball);color:var(--ink);font-weight:800;text-decoration:none;border-radius:999px;padding:15px 24px;min-height:50px}
.cta.alt{background:var(--court);color:#fff}
@media (max-width:600px){
  body{font-size:16px}
  .hero{padding:36px 0 40px}
  .hero::before{inset:10px}
  .hero::after{display:none}
  .hero .wrap{margin:0 22px;padding:22px 18px}
  .wrap{padding:0 16px}
  th,td{padding:11px 12px}
  form{padding:20px;max-width:none}
  section{padding-top:32px}
  .notice{padding:14px 16px}
}
</style>
</head>
<body>
{% for m in messages %}<div class="msg"><div class="wrap">{{ m }}</div></div>{% endfor %}
{% block body %}{% endblock %}
</body>
</html>
